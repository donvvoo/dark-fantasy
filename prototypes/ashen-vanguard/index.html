<script>
'use strict';
// 잿빛 선봉대: a portrait idle RPG. A knight walks a ruined road; companions join the column;
// gold buys levels, bosses gate every 10 stages, rebirth trades the run for embers.
// Around that loop: skills in three slots, a crypt dungeon for materials, knight-order ranks
// earned in trials, companion stars, gear enhance and merge, and a spirit that follows the party.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 360, H = 640;         // logical size: a portrait phone screen
const PIXEL = true;             // dot look: the whole screen draws at 360x640 real pixels, then scales up unsmoothed
const FONT = '"Galmuri11","Apple SD Gothic Neo","Malgun Gothic","WenQuanYi Zen Hei",sans-serif'; // Korean pixel font, 11px grid
const TITLE = '잿빛 선봉대';
const CONTROLS = ['화면 탭: 베기 (Space) · 스킬: Z X C', '탭: Q 파티 · W 스킬 · E 장비 · A 모험 · F 임무 · S 환생', '1~4 강화 · D 던전 · G 승급 시험 · B 보스 도전', 'P 일시정지 · M 소리'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { // fills the window; every logical pixel stays one hard-edged block
  const k = Math.min(innerWidth / W, innerHeight / H);
  canvas.width = W; canvas.height = H;
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  canvas.style.imageRendering = 'pixelated';
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit); fit();
// Galmuri11 is drawn only at its native 11px and at 2x/4x, so every glyph lands on the pixel grid.
if (window.PIXEL_FONTS && window.FontFace) {
  const bin = b64 => Uint8Array.from(atob(b64), ch => ch.charCodeAt(0)).buffer;
  [['Galmuri11', PIXEL_FONTS.Galmuri11, 'normal'], ['Galmuri11', PIXEL_FONTS.Galmuri11B, 'bold']].forEach(([fam, data, weight]) => {
    try { const f = new FontFace(fam, bin(data), { weight }); f.load().then(ff => document.fonts.add(ff)); } catch (e) { /* falls back to system fonts */ }
  });
}
function pxSize(size) { return size >= 36 ? 44 : size >= 18 ? 22 : 11; }
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function setFont(size, weight) {
  const px = pxSize(size);
  ctx.font = `${weight === 'normal' ? 'normal' : 'bold'} ${px}px ${FONT}`; ctx.textBaseline = 'middle';
  return px;
}
function text(s, x, y, size, c, align = 'center', weight = 'bold') {
  setFont(size, weight); ctx.textAlign = align; ctx.fillStyle = c;
  ctx.fillText(s, Math.round(x), Math.round(y));
}
function textOutlined(s, x, y, size, c, align = 'center') { // a 1-pixel dark outline, drawn as eight offset copies
  const px = setFont(size, 'bold'); ctx.textAlign = align; x = Math.round(x); y = Math.round(y);
  const o = px >= 22 ? 2 : 1;
  ctx.fillStyle = '#0a0808';
  for (const [dx, dy] of [[-o, 0], [o, 0], [0, -o], [0, o], [-o, -o], [o, -o], [-o, o], [o, o]]) ctx.fillText(s, x + dx, y + dy);
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function textWidth(s, size, weight = 'bold') { setFont(size, weight); return ctx.measureText(s).width; }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function bitmap(rows, x, y, pal, s = 1) { // rows of palette keys, '.' empty, s pixels per dot
  x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
    const c = pal[rows[j][i]]; if (c) { ctx.fillStyle = c; ctx.fillRect(x + i * s, y + j * s, s, s); }
  }
}
function disc(cx, cy, r, c) { // a pixel circle, row by row
  ctx.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); }
}
function pixelLine(x0, y0, x1, y1, w, c) { // a stepped line of w-by-w blocks
  ctx.fillStyle = c; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) ctx.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), w, w);
}

// ---- Palette: dark ruins, bright figures; the UI is oak, leather and gold ------------------
const PAL = {

  road: '#3a332d', roadDark: '#2a2420', roadHi: '#4a4139',

  threat: '#e04848', ember: '#ff6a2a', holy: '#ffe9a6', gem: '#5fb6ff', soul: '#c084ff', scroll: '#e8d3a8',
  wood: '#5b3a22', woodHi: '#7d5230', woodDk: '#3a2414', trim: '#d4a24a', trimHi: '#ffe08a', leather: '#2a1d16', leatherHi: '#36261c',
  common: '#d8d2c6', rare: '#5fb6ff', epic: '#c97cff', legend: '#ffb02e', good: '#8ee27a',
};

// ---- Sprites (PixelLab: 32px heroes, monsters, spirits and icons; 64px bosses; drawn 2x) ----
const SPR = {};
const SPRITE_SCALE = 2;
const META = {}; // per sprite, measured once loaded: empty rows under the feet and a square crop of the face
function measure(n, im) {
  try {
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data;
    let top = c.height, bottom = -1, left = c.width, right = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 40) {
      if (y < top) top = y; if (y > bottom) bottom = y; if (x < left) left = x; if (x > right) right = x;
    }
    if (bottom < 0) return;
    const side = Math.round((bottom - top) * 0.5), cx = Math.round((left + right) / 2);
    META[n] = { foot: c.height - 1 - bottom, face: [Math.max(0, cx - side / 2 - 2), top, side, side], top };
  } catch (e) { /* a tainted canvas: keep the defaults */ }
}
Object.keys(window.SPRITES || {}).forEach(n => { const im = new Image(); im.onload = () => measure(n, im); im.src = SPRITES[n]; SPR[n] = im; });
function drawSprite(name, x, y, opts = {}) { // x: centre, y: feet
  const im = SPR[name];
  if (!im || !im.complete || !im.naturalWidth) return;
  const sc = (im.naturalWidth >= 48 ? 1 : SPRITE_SCALE) * (opts.scale || 1); // 64px and up draw 1:1
  const w = im.naturalWidth * sc, h = im.naturalHeight * sc;
  ctx.save();
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (opts.flash) ctx.filter = 'brightness(2.6)';
  if (opts.dark) ctx.filter = 'brightness(0.2)';
  ctx.translate(Math.round(x), Math.round(y));
  if (opts.rot) ctx.rotate(opts.rot);
  ctx.drawImage(im, -Math.round(w / 2), -h + Math.round(((META[name] && META[name].foot) || 0) * sc), w, h); // feet on the line
  ctx.restore();
}
function drawIcon(name, x, y, dark) { // a 32px PixelLab icon at 1x, top-left at x,y
  const im = SPR[name]; if (!im || !im.complete || !im.naturalWidth) return;
  ctx.save(); if (dark) ctx.filter = 'brightness(0.3) saturate(0)'; ctx.drawImage(im, Math.round(x), Math.round(y)); ctx.restore();
}

// ---- Content -------------------------------------------------------------------------------
const HEROES = [
  { id: 'knight', name: '에드릭', role: '근접 · 탭', cost: 'knightCost', dps: 'knightDps', every: 'knightInterval' },
  { id: 'archer', name: '리안', role: '궁수 · 연사', cost: 'archerCost', dps: 'archerDps', every: 'archerInterval' },
  { id: 'cleric', name: '세라', role: '성직자 · 아군 강화', cost: 'clericCost', dps: 'clericDps', every: 'clericInterval' },
  { id: 'pyro', name: '모르간', role: '화염술사 · 폭발', cost: 'pyroCost', dps: 'pyroDps', every: 'pyroInterval' },
];
const ENEMIES = [
  { id: 'skeleton', name: '해골 전사' }, { id: 'ghoul', name: '굶주린 구울' },
  { id: 'bat', name: '흡혈 박쥐', fly: true }, { id: 'cultist', name: '뿔가면 광신도' },
];
const BOSSES = [
  { id: 'boss_rider', name: '뼈의 기수' }, { id: 'boss_priest', name: '역병 사제' }, { id: 'boss_lord', name: '잿불의 군주' },
];
const CRYPT = [{ id: 'boss_warden', name: '지하묘지 간수' }, { id: 'boss_wyrm', name: '뼈의 비룡' }];
const EXAMINER = { id: 'boss_examiner', name: '기사단 시험관' };
const SKILLS = [
  { id: 'slash', name: '잿불 베기', icon: 'icon_slash', cd: 'slashCd', unlock: 'slashUnlock', desc: k => `적 하나에 파티 피해 x${fmt(tune.slashPower * k)} + 탭 5회` },
  { id: 'rain', name: '화살비', icon: 'icon_rain', cd: 'rainCd', unlock: 'rainUnlock', desc: k => `화살 6발, 각각 파티 피해 x${fmt(tune.rainPower * k)}` },
  { id: 'sanct', name: '성역의 빛', icon: 'icon_sanct', cd: 'sanctCd', unlock: 'sanctUnlock', desc: k => `${tune.sanctTime}초 동안 파티 피해 +${Math.round(tune.sanctBoost * k * 100)}%` },
  { id: 'storm', name: '화염 폭풍', icon: 'icon_storm', cd: 'stormCd', unlock: 'stormUnlock', desc: k => `파티 피해 x${fmt(tune.stormPower * k)} 폭발 + 3초 화상` },
  { id: 'cry', name: '전투의 함성', icon: 'icon_cry', cd: 'cryCd', unlock: 'cryUnlock', desc: k => `${tune.cryTime}초 동안 탭 x${fmt(3 * k)}, 초당 ${tune.cryTaps}회 자동 탭` },
  { id: 'gold', name: '황금의 손길', icon: null, cd: 'goldCd', unlock: 'goldUnlock', desc: k => `${tune.goldTime}초 동안 금화 x${fmt(1 + k)}` },
];
const SPIRITS = [
  { id: 'fire', sprite: 'spirit_fire', name: '불씨 정령', rank: 1, desc: lv => `파티 피해 +${Math.round((tune.fireBase + tune.fireLv * (lv - 1)) * 100)}%` },
  { id: 'frost', sprite: 'spirit_frost', name: '서리 정령', rank: 2, desc: lv => `제한 시간 +${fmt(tune.frostBase + tune.frostLv * (lv - 1))}초` },
  { id: 'light', sprite: 'spirit_light', name: '빛 정령', rank: 3, desc: lv => `금화 +${Math.round((tune.lightBase + tune.lightLv * (lv - 1)) * 100)}%` },
];
const RANKS = ['견습 기사', '종자', '정기사', '기사장', '성기사', '잿불 성기사'];
const RARITY = [
  { name: '일반', color: PAL.common, k: 'gearCommon' }, { name: '희귀', color: PAL.rare, k: 'gearRare' },
  { name: '영웅', color: PAL.epic, k: 'gearEpic' }, { name: '전설', color: PAL.legend, k: 'gearLegend' },
];
const GEAR_NAMES = {
  weapon: ['녹슨 장검', '기사의 장검', '흑철 대검', '잿불 군주살해자'],
  armor: ['누더기 사슬갑옷', '순례자의 흉갑', '흑철 판금', '잿불 성갑'],
};
const MILESTONES = [25, 50, 100, 200, 400];

// ---- Coming back: daily orders, attendance, achievements (calendar days are the only real clock read) ----
const DAILY = [
  { id: 'kills', name: '몬스터 처치', need: 'dailyKills', reward: { stones: 30 } },
  { id: 'taps', name: '직접 베기 (탭)', need: 'dailyTaps', reward: { scrolls: 3 } },
  { id: 'ups', name: '동료 강화', need: 'dailyUps', reward: { souls: 3 } },
  { id: 'casts', name: '스킬 사용', need: 'dailyCasts', reward: { stones: 20 } },
  { id: 'dungeons', name: '지하묘지 돌파', need: 'dailyDungeons', reward: { keys: 1, scrolls: 2 } },
];
const DAILY_BONUS = { souls: 5, stones: 50 };
const ATTEND = [{ stones: 20 }, { scrolls: 3 }, { keys: 2 }, { souls: 5 }, { stones: 60 }, { scrolls: 6 }, { souls: 15, stones: 100 }];
const ACH = [ // chains: each tier pays once, the next tier shows after it
  { id: 'stage', name: '최고 스테이지', of: () => state.bestStage, tiers: [10, 20, 30, 50, 80], reward: i => ({ souls: 5 * (i + 1) }) },
  { id: 'boss', name: '보스 처치', of: () => state.stats.bossKills, tiers: [3, 10, 30, 100], reward: i => ({ scrolls: 3 * (i + 1) }) },
  { id: 'kills', name: '몬스터 처치', of: () => state.stats.kills, tiers: [500, 2000, 10000, 50000], reward: i => ({ stones: 40 * (i + 1) }) },
  { id: 'rebirth', name: '환생', of: () => state.rebirths, tiers: [1, 3, 10], reward: i => ({ souls: 10 * (i + 1) }) },
  { id: 'rank', name: '기사단 서열', of: () => state.rank, tiers: [1, 2, 3, 4, 5], reward: i => ({ keys: 1, scrolls: 4 * (i + 1) }) },
  { id: 'crypt', name: '지하묘지 층', of: () => state.floor - 1, tiers: [3, 6, 10, 20], reward: i => ({ stones: 80 * (i + 1) }) },
];
function today() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function checkDay() { // a new calendar day: fresh orders, and attendance can be claimed again
  const t = today();
  if (state.daily.day !== t) state.daily = { day: t, prog: {}, claimed: {}, bonus: false };
}
function count(id, n = 1) { if (state.stats[id] !== undefined) state.stats[id] += n; state.daily.prog[id] = (state.daily.prog[id] || 0) + n; }
function grant(r) {
  const k = tune.rewardScale, got = [];
  for (const [key, v] of Object.entries(r)) {
    const n = key === 'keys' ? v : Math.ceil(v * k);
    if (key === 'keys') state.keys = Math.min(tune.keysMax + 5, state.keys + n); else state[key] += n;
    got.push(`${{ stones: '강화석', scrolls: '두루마리', souls: '영혼석', keys: '열쇠', gold: '금화' }[key]} +${fmt(n)}`);
  }
  tone(784, 0.15, 'triangle', 0.2); tone(1046, 0.25, 'triangle', 0.2);
  return got.join(' · ');
}
function dailyDone(q) { return (state.daily.prog[q.id] || 0) >= tune[q.need]; }
function claimDaily(i) {
  const q = DAILY[i]; if (!q || state.daily.claimed[q.id] || !dailyDone(q)) return;
  state.daily.claimed[q.id] = true; toast(`임무 완료! ${grant(q.reward)}`, PAL.trimHi);
}
function claimDailyBonus() {
  if (state.daily.bonus || !DAILY.every(q => state.daily.claimed[q.id])) return;
  state.daily.bonus = true; popup('오늘의 임무 전부 완료!', [grant(DAILY_BONUS)], PAL.trimHi);
}
function canAttend() { return state.attend.last !== today(); }
function claimAttend() {
  if (!canAttend()) return;
  const i = state.attend.idx % ATTEND.length;
  state.attend = { last: today(), idx: state.attend.idx + 1 };
  popup(`출석 ${i + 1}일째`, [grant(ATTEND[i])], PAL.trimHi);
}
function achTier(a) { return state.ach[a.id] || 0; }
function achReady(a) { const i = achTier(a); return i < a.tiers.length && a.of() >= a.tiers[i]; }
function claimAch(id) {
  const a = ACH.find(x => x.id === id); if (!a || !achReady(a)) return;
  const i = achTier(a); state.ach[a.id] = i + 1; toast(`업적: ${a.name} ${a.tiers[i]} · ${grant(a.reward(i))}`, PAL.trimHi);
}
function questAlert() {
  return canAttend() || DAILY.some(q => dailyDone(q) && !state.daily.claimed[q.id])
    || (!state.daily.bonus && DAILY.every(q => state.daily.claimed[q.id])) || ACH.some(achReady);
}

// ---- Numbers ------------------------------------------------------------------------------
const UNITS = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  let u = 0; while (n >= 1000 && u < 60) { n /= 1000; u++; }
  const name = u < UNITS.length ? UNITS[u] : String.fromCharCode(97 + Math.floor((u - 5) / 26)) + String.fromCharCode(97 + (u - 5) % 26);
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + name;
}
function fmtTime(s) {
  s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return h ? `${h}시간 ${m}분` : m ? `${m}분 ${ss}초` : `${ss}초`;
}

// ---- Rules: pure functions of state -----------------------------------------------------
function isBossStage(s) { return s % tune.bossEvery === 0; }
function bossIndex(s) { return Math.floor(s / tune.bossEvery) - 1; }
function stageHp(s) { return tune.hpBase * Math.pow(tune.hpGrowth, s - 1); }
function enemyHp(s, boss) { return boss ? stageHp(s) * (tune.bossHpMult + tune.bossHpMultStep * bossIndex(s)) : stageHp(s); }
function dungeonHp(f) { return stageHp(tune.dungeonStage + f * tune.dungeonFloorStep) * tune.dungeonHpMult; }
function rankReq(r) { return r * tune.rankReqStep; }
function trialHp(r) { return stageHp(rankReq(r)) * tune.trialHpMult; }
function emberMult() { return 1 + state.embers * tune.emberBonus; }
function spiritLv(id) { return state.spiritLv[id] || 0; }
function spiritOn(id) { return state.spirit === id && spiritLv(id) > 0; }
function fireBonus() { return spiritOn('fire') ? tune.fireBase + tune.fireLv * (spiritLv('fire') - 1) : 0; }
function frostBonus() { return spiritOn('frost') ? tune.frostBase + tune.frostLv * (spiritLv('frost') - 1) : 0; }
function lightBonus() { return spiritOn('light') ? tune.lightBase + tune.lightLv * (spiritLv('light') - 1) : 0; }
function gearPct(slot) { const g = state.gear[slot]; return g ? Math.round(g.pct * (1 + (g.plus || 0) * tune.enhPct)) : 0; }
function skillK(id) { return 1 + tune.skillLvStep * ((state.skillLv[id] || 1) - 1); }
function partyMult() {
  return (1 + gearPct('weapon') / 100) * emberMult() * (1 + state.lv.cleric * tune.clericAura)
    * Math.pow(tune.rankBonus, state.rank) * (1 + fireBonus())
    * (state.buffs.sanct > 0 ? 1 + tune.sanctBoost * skillK('sanct') : 1);
}
function goldMult() { return (1 + gearPct('armor') / 100) * emberMult() * (1 + lightBonus()) * (state.buffs.gold > 0 ? 1 + skillK('gold') : 1); }
function milestoneMult(lv) { let m = 1; for (const t of MILESTONES) if (lv >= t) m *= tune.milestoneMult; return m; }
function nextMilestone(lv) { for (const t of MILESTONES) if (lv < t) return t; return null; }
function starMult(id) { return Math.pow(tune.starMult, state.stars[id] || 0); }
function heroCost(h) { return Math.ceil(tune[h.cost] * Math.pow(tune.costGrowth, state.lv[h.id])); }
function heroDps(h, lv = state.lv[h.id]) {
  if (lv <= 0) return 0;
  if (h.id === 'knight' && lv < tune.autoUnlockLevel) return 0;
  return tune[h.dps] * lv * milestoneMult(lv) * starMult(h.id) * partyMult();
}

// ---- Enemies, by mode: the road, the crypt or the trial ------------------------------------

// ---- Gear: drops, enhance, store and merge -------------------------------------------------

  if (state.confirm > 0) state.confirm -= dt;
  if (state.toast && (state.toast.t -= dt) <= 0) state.toast = null;
  if (state.popup && (state.popup.t -= dt) <= 0) state.popup = null;
  if (state.away) {
    if (taps.length || pressed('Space') || pressed('Enter')) {
      const a = state.away; state.gold += a.gold; state.stones += a.stones; state.scrolls += a.scrolls; state.souls += a.souls;
      state.away = null; tone(660, 0.2, 'triangle', 0.2); tone(990, 0.3, 'triangle', 0.2);
      if (canAttend()) toast('출석 보상을 받을 수 있다 (임무 탭)', PAL.trimHi);
    }
    taps.length = 0; return;
  }
  for (const p of taps) {
    const b = hitButton(p.x, p.y);
    if (b) press(b.id);
    else if (p.y > HUD_H && p.y < FIELD_B) tapAttack(p.x, p.y);
  }
  taps.length = 0;
  if (pressed('Space')) tapAttack();
  ['Digit1', 'Digit2', 'Digit3', 'Digit4'].forEach((k, i) => { if (pressed(k)) { state.tab = 'party'; buyHero(i); } });
  [['KeyQ', 'party'], ['KeyW', 'skill'], ['KeyE', 'gear'], ['KeyA', 'adv'], ['KeyF', 'quest'], ['KeyS', 'rebirth']].forEach(([k, tb]) => { if (pressed(k)) state.tab = tb; });
  ['KeyZ', 'KeyX', 'KeyC'].forEach((k, i) => {
    if (!pressed(k)) return;
    if (state.tab === 'gear' && state.drop && i < 2) { i === 0 ? equipDrop() : storeDrop(); return; }
    const id = state.slots[i]; if (id) castSkill(id);
  });
  if (pressed('KeyB')) challengeBoss();
  if (pressed('KeyD')) enterDungeon();
  if (pressed('KeyG')) startTrial();
  if (pressed('KeyR') && state.tab === 'rebirth') rebirth();
  // keys come back with time
  if (state.keys < tune.keysMax) { state.keyT += dt; if (state.keyT >= tune.keyRegen) { state.keyT = 0; state.keys++; } } else state.keyT = 0;
  // buffs and skill cooldowns
  for (const k in state.buffs) if (state.buffs[k] > 0) state.buffs[k] -= dt;
  for (const k in state.skillCd) if (state.skillCd[k] > 0) state.skillCd[k] -= dt;
  if (state.buffs.burn > 0 && targetable()) damage(totalDps() * dt * skillK('storm'), false, PAL.ember);
  if (state.buffs.cry > 0) { state.cryTap += dt * tune.cryTaps; while (state.cryTap >= 1) { state.cryTap--; if (targetable()) tapAttack(undefined, undefined, true); } }
  if (state.rain) {
    state.rain.t -= dt;
    if (state.rain.t <= 0 && state.rain.n > 0) {
      state.rain.t = 0.18; state.rain.n--;
      state.shots.push({ kind: 'fall', x0: enemyX() - 30 + rng() * 60, y0: HUD_H, x1: enemyX() + (rng() - 0.5) * 20, y1: groundY() - 24, arc: 0, t: 0, dur: 0.22, dmg: totalDps() * tune.rainPower * skillK('rain'), color: PAL.good });
    }
    if (state.rain.n <= 0) state.rain = null;
  }
  if (state.autoSkill) for (let i = 0; i < slotsOpen(); i++) { const id = state.slots[i]; if (id && !(state.skillCd[id] > 0)) castSkill(id); }
  // marching between enemies
  const e = state.enemy;
  if (!e) {
    state.march -= dt; state.scroll += dt * 140;
    if (state.march <= 0) spawnEnemy(false);
  } else if (e.dead) {
    e.dead += dt; if (e.dead > 0.4) { state.enemy = null; state.march = tune.marchTime; }
  } else {
    if (e.x > 0) { e.x = Math.max(0, e.x - dt / tune.enemyWalkIn); state.scroll += dt * 60; }
    if (e.flash > 0) e.flash -= dt;
    if (e.boss) e.lunge = (e.lunge + dt) % 2.2;
    if (e.boss && state.mode === 'stage') { state.bossT -= dt; if (state.bossT <= 0) failBoss(); }
  }
  if (state.mode !== 'stage') {
    state.modeT -= dt;
    if (state.modeT <= 0) { if (state.mode === 'trial') { leaveMode(false); popup('시험 실패', ['더 강해져서 다시 도전하라'], PAL.muted); } else leaveMode(false); }
  }
  // the party attacks on its own clocks
  const target = targetable();
  for (const h of HEROES) {
    state.anim[h.id] = Math.max(0, state.anim[h.id] - dt);
    const dps = heroDps(h); if (!dps) continue;
    state.cd[h.id] -= dt;
    if (state.cd[h.id] > 0 || !target) continue;
    state.cd[h.id] += tune[h.every];
    const hit = dps * tune[h.every], x0 = heroX(h.id), gy = groundY();
    if (h.id === 'knight') { state.anim.knight = 0.18; damage(hit, false, PAL.ink); tone(300, 0.05, 'square', 0.06); }
    if (h.id === 'archer') { state.anim.archer = 0.12; state.shots.push({ kind: 'arrow', x0: x0 + 12, y0: gy - 34, x1: enemyX(), y1: gy - 30, arc: 14, t: 0, dur: 0.25, dmg: hit, color: PAL.good }); tone(1200, 0.03, 'triangle', 0.05); }
    if (h.id === 'cleric') { state.anim.cleric = 0.4; state.sparks.push({ x: enemyX(), y: 0, t: 0, pillar: true, vx: 0, vy: 0 }); damage(hit, false, PAL.holy); tone(880, 0.2, 'sine', 0.08); }
    if (h.id === 'pyro') { state.anim.pyro = 0.3; state.shots.push({ kind: 'fire', x0: x0 + 16, y0: gy - 36, x1: enemyX(), y1: gy - 28, arc: 40, t: 0, dur: 0.45, dmg: hit, color: PAL.ember }); tone(160, 0.25, 'sawtooth', 0.08); }
  }
  for (const s of state.shots) { s.t += dt; if (s.t >= s.dur && !s.done) { s.done = true; damage(s.dmg, false, s.color); if (s.kind === 'fire') for (let k = 0; k < 10; k++) state.sparks.push({ x: s.x1, y: s.y1, vx: (rng() - 0.5) * 140, vy: -rng() * 120, t: 0 }); } }
  state.shots = state.shots.filter(s => !s.done);
  for (const p of state.sparks) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  state.sparks = state.sparks.filter(p => p.t < (p.pillar ? 0.45 : p.slash ? 0.2 : 0.7));
  for (const f of state.fx) f.t += dt;
  state.fx = state.fx.filter(f => f.t < 0.8);
  for (const f of state.floats) f.t += dt;
  state.floats = state.floats.filter(f => f.t < 0.9);
  state.saveT += dt; if (state.saveT >= tune.saveEvery) { state.saveT = 0; save(); }
  if (resultsPending > 0 && (resultsPending -= dt) <= 0) { scene = 'results'; save(); }
}

const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#1a1410');
      ribbon(W / 2, 6, 200, '잿빛 선봉대: 등장 인물');
      const rows = [HEROES.map(h => [h.id, h.name]), ENEMIES.map(e => [e.id, e.name])];
      rows.forEach((row, r) => row.forEach(([id, name], i) => {
        const x = 46 + i * 89, y = 106 + r * 96;
        card(x - 42, y - 76, 84, 92, '#6a4a2a', '#241a14'); drawSprite(id, x, y - 4); text(name, x, y + 8, 11, PAL.ink);
      }));
      SPIRITS.forEach((sp, i) => { const x = 60 + i * 120; drawSprite(sp.sprite, x, 256); text(sp.name, x, 262, 11, PAL.gem); });
      const big = [...BOSSES, ...CRYPT, EXAMINER];
      big.forEach((b, i) => { const x = 62 + (i % 3) * 118, y = 400 + Math.floor(i / 3) * 150; drawSprite(b.id, x, y); text(b.name, x, y + 10, 11, PAL.threat); });
    },
  },
  title: {
    update() {
      const t = taps.shift(); taps.length = 0;
      if ((t && t.y > 572) || pressed('KeyN')) { reset(); scene = 'play'; return; }
      if (t || pressed('Enter') || pressed('Space')) {
        const s = hasSave && loadSave();
        if (s) continueSave(s); else reset();
        scene = 'play';
      }
    },
    draw() {
      const t = clock.now();
      clear('#07070a');
      const gr = 200 + Math.round(Math.sin(t * 9) * 4);
      [[1, 0.05], [0.75, 0.07], [0.5, 0.09], [0.28, 0.12]].forEach(([k, al]) => disc(W / 2, 330, Math.round(gr * k), `rgba(255,140,60,${al})`));
      rect(0, 360, W, 4, '#2a2420');
      drawSprite('knight', W / 2 - 30, 362, { scale: 2 });
      drawSprite('spirit_fire', W / 2 + 56, 310 + Math.round(Math.sin(t * 3) * 4));
      woodFrame(40, 70, W - 80, 96, '#1a120e');
      textOutlined(TITLE, W / 2, 108, 40, PAL.torchHi);
      ribbon(W / 2, 140, 160, 'ASHEN VANGUARD');
      CONTROLS.forEach((c, i) => text(c, W / 2, 396 + i * 20, 11, PAL.muted, 'center', 'normal'));
      ctx.globalAlpha = 0.6 + Math.sin(t * 4) * 0.4;
      textOutlined(hasSave ? '탭해서 이어하기 (Enter)' : '탭해서 시작 (Enter)', W / 2, 530, 18, PAL.ink); ctx.globalAlpha = 1;
      if (hasSave) text('여기를 누르면 새로 시작 (N)', W / 2, 600, 11, PAL.dim);
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      updatePlay(dt);
    },
    draw() { clear('#07070a'); drawField(); drawHud(); drawStrip(); drawPanel(); drawAway(); },
  },
  pause: {
    update() { const t = taps.length; taps.length = 0; if (t || pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(5,4,8,0.7)'; ctx.fillRect(0, 0, W, H);
      woodFrame(70, H / 2 - 50, W - 140, 90, '#1a120e');
      textOutlined('일시정지', W / 2, H / 2 - 14, 20, PAL.ink); text('탭하거나 P로 계속', W / 2, H / 2 + 18, 11, PAL.muted);
    },
  },
  results: {
    update() { const t = taps.length; taps.length = 0; if (t || pressed('Enter')) scene = 'play'; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(5,4,8,0.8)'; ctx.fillRect(0, 0, W, H);
      woodFrame(24, 170, W - 48, 230, '#1a120e');
      flame(W / 2, 214, 3);
      ribbon(W / 2, 248, 220, '잿불의 군주가 쓰러졌다');
      text(`걸린 시간 ${fmtTime(state.playTime)} · 환생 ${state.rebirths}회`, W / 2, 290, 11, PAL.ink, 'center', 'normal');
      text(`잿불 ${state.embers}개 · 서열 ${RANKS[state.rank]} · 최고 스테이지 ${state.bestStage}`, W / 2, 310, 11, PAL.ink, 'center', 'normal');
      text('행군은 계속된다. 탭해서 계속 (Enter)', W / 2, 360, 11, PAL.muted);
    },
  },
};

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
canvas.addEventListener('pointerdown', e => {
  startAudio();
  const r = canvas.getBoundingClientRect();
  taps.push({ x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H });
  e.preventDefault();
});
addEventListener('blur', () => { down.clear(); if (scene === 'play') save(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && scene === 'play') save(); });

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
